name: Post an existing reel (manual)

# Re-post an already-built reel (any release tag) to chosen platforms — e.g. a reel that went to
# Instagram/Facebook/YouTube before TikTok was connected. Same approval gate as the daily run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag of the reel, e.g. reel-20261107-0648"
        required: true
      platforms:
        description: "Comma list, e.g. tiktok  or  instagram,facebook,youtube,tiktok"
        required: true
        default: tiktok

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: social
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the reel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release download "$TAG" -p "$TAG.mp4" -p "$TAG-cover.jpg" -D post
          gh release view "$TAG" --json body --jq .body > post/caption.txt
          gh release view "$TAG" --json name --jq .name > post/title.txt
      - name: Post via Upload-Post
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          POST_PLATFORMS: ${{ github.event.inputs.platforms }}
          IDEMPOTENCY_KEY: ${{ github.event.inputs.tag }}-${{ github.event.inputs.platforms }}
        run: |
          pip install --quiet requests
          TAG="${{ github.event.inputs.tag }}"
          python3 scripts/post_social.py "post/$TAG.mp4" "$(cat post/title.txt)" post/caption.txt "post/$TAG-cover.jpg"
