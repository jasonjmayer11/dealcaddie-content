name: Daily Deal Verdict reel

on:
  schedule:
    # Twice a day (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "17 13 * * *"   # ~6–7am Denver
    - cron: "47 21 * * *"   # ~2–3pm Denver
  workflow_dispatch:
    inputs:
      listing:
        description: "Optional: a Zillow URL or address to run instead of the next one in queue.txt"
        required: false
      audience:
        description: "investor, agent, or auto (auto = investor in the morning slot, agent in the afternoon slot)"
        type: choice
        options: [auto, investor, agent]
        default: auto
      debug:
        description: "Attach the raw card captures to the release"
        type: boolean
        default: false

permissions:
  contents: write   # pop the queue + publish the reel as a release

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # concurrency lives on the build job (not the workflow) so a reel waiting for your
    # approval never blocks or cancels the next scheduled build
    concurrency:
      group: daily-reel
      cancel-in-progress: false
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache the Chromium download between runs (~300 MB)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      # No apt: the Ubuntu mirror can stall for 10+ minutes. GitHub's runner image
      # already has Chromium's system libraries; ffmpeg comes as a static build.
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          pip install --quiet pillow numpy

      - name: Check tools
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264 && echo "ffmpeg ok (libx264)"
          python3 -c "import PIL; print('pillow', PIL.__version__)"

      - name: Pick listing
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.listing }}" ]; then
            echo "listing=${{ github.event.inputs.listing }}" >> "$GITHUB_OUTPUT"
            echo "from_queue=false" >> "$GITHUB_OUTPUT"
          else
            L=$(grep -v '^\s*$' queue.txt | head -n1)
            if [ -z "$L" ]; then echo "::error::queue.txt is empty — add more listings"; exit 1; fi
            echo "listing=$L" >> "$GITHUB_OUTPUT"
            echo "from_queue=true" >> "$GITHUB_OUTPUT"
          fi
          echo "slug=reel-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          A="${{ github.event.inputs.audience }}"
          if [ -z "$A" ] || [ "$A" = "auto" ]; then
            # use WHICH schedule fired, not the clock: GitHub can start the morning run hours late
            case "${{ github.event.schedule }}" in
              "17 13 * * *") A=investor ;;
              "47 21 * * *") A=agent ;;
              *) if [ "$(date -u +%H)" -ge 17 ]; then A=agent; else A=investor; fi ;;
            esac
          fi
          echo "audience=$A" >> "$GITHUB_OUTPUT"
          echo "audience: $A"

      - name: Record analysis
        env:
          DC_EMAIL: ${{ secrets.DC_EMAIL }}
          DC_PASSWORD: ${{ secrets.DC_PASSWORD }}
        run: node scripts/record.js "${{ steps.pick.outputs.listing }}" work

      - name: Assemble reel
        env:
          AUDIENCE: ${{ steps.pick.outputs.audience }}
          AGENT_PRICE: ${{ vars.AGENT_PRICE }}
        run: |
          mkdir -p dist
          python3 scripts/assemble.py work "dist/${{ steps.pick.outputs.slug }}.mp4"
          mv dist/cover.jpg "dist/${{ steps.pick.outputs.slug }}-cover.jpg"
          cat dist/caption.txt

      - name: Publish as a release (caption in the notes, MP4 + cover attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python3 -c "import json;m=json.load(open('dist/meta.json'));print(' '.join(m['hook']))")
          TAG="${{ steps.pick.outputs.slug }}"
          # retry: GitHub's API occasionally returns 5xx
          for i in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "dist/$TAG.mp4" "dist/$TAG-cover.jpg" --clobber && break
            elif gh release create "$TAG" "dist/$TAG.mp4" "dist/$TAG-cover.jpg" \
                   --title "$TITLE" --notes-file dist/caption.txt; then
              if [ "${{ github.event.inputs.debug }}" = "true" ]; then
                gh release upload "$TAG" work/card_*.png work/page_*.png work/beat*.png work/logo.png --clobber || true
              fi
              break
            fi
            [ "$i" = 4 ] && { echo "::error::release failed after 4 tries"; exit 1; }
            echo "release attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
          done

      - name: Quality gate + review summary
        id: gate
        run: |
          TAG="${{ steps.pick.outputs.slug }}"
          OK=$(python3 - <<'PY'
          import json
          m = json.load(open("dist/meta.json"))
          ok = bool(m.get("had_photo")) and bool(m.get("price")) and bool(m.get("score")) and m.get("ltrCashflow") is not None
          print("true" if ok else "false")
          PY
          )
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"
          {
            echo "## 🎬 $TAG"
            if [ "$OK" = "true" ]; then echo "**Ready for review.** Watch it, then approve the *post* job below to publish."; else echo "**⚠️ Failed the quality gate** (missing photo, price, score or cash flow) — it will NOT be offered for posting."; fi
            echo ""
            echo "▶️ [Watch the video]($URL/download/$TAG.mp4) · [Release page]($URL)"
            echo ""
            echo "**Cover / thumbnail** (used on Instagram, Facebook and YouTube)"
            echo ""
            echo "<img src=\"https://github.com/${{ github.repository }}/releases/download/$TAG/$TAG-cover.jpg\" width=\"270\">"
            echo ""
            echo "**Caption**"
            echo '```'
            cat dist/caption.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the raw files for 14 days (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.slug }}
          path: |
            work/*.json
            work/*.png
            work/photo.jpg
            dist/
          retention-days: 14
          if-no-files-found: ignore

      - name: Pop the queue
        if: always() && steps.pick.outputs.from_queue == 'true'
        run: |
          L="${{ steps.pick.outputs.listing }}"
          RESULT=${{ job.status }}
          grep -vxF "$L" queue.txt > queue.tmp || true
          mv queue.tmp queue.txt
          if [ "$RESULT" = "success" ]; then
            echo "$(date -u +%F),${{ steps.pick.outputs.slug }},$L" >> done.csv
          else
            echo "$(date -u +%F),$L" >> failed.txt
          fi
          git config user.name "dealcaddie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.txt
          for f in done.csv failed.txt; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -m "Reel ${{ steps.pick.outputs.slug }}: $RESULT" || echo "nothing to commit"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push && break
            [ "$i" = 4 ] && { echo "::error::push failed after 4 tries"; exit 1; }
            echo "push attempt $i failed; retrying in $((i*15))s"; sleep $((i*15))
          done

  # Waits for Jason's approval (environment "social" has him as a required reviewer),
  # then posts the reel through Upload-Post. Reject or ignore it and nothing is posted.
  post:
    needs: reel
    # off until Jason sets repo variable POSTING_ENABLED=on (only after the 'social' environment has him as required reviewer)
    if: needs.reel.result == 'success' && needs.reel.outputs.ok == 'true' && vars.APPROVAL_MODE == 'github' && vars.POSTING_ENABLED == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: social
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.reel.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the approved reel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.reel.outputs.slug }}"
          gh release download "$TAG" -p "$TAG.mp4" -p "$TAG-cover.jpg" -D post
          gh release view "$TAG" --json body --jq .body > post/caption.txt
          gh release view "$TAG" --json name --jq .name > post/title.txt
      - name: Post via Upload-Post
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          POST_PLATFORMS: ${{ vars.POST_PLATFORMS }}
          IDEMPOTENCY_KEY: ${{ needs.reel.outputs.slug }}
        run: |
          pip install --quiet requests
          python3 scripts/post_social.py "post/${{ needs.reel.outputs.slug }}.mp4" "$(cat post/title.txt)" post/caption.txt "post/${{ needs.reel.outputs.slug }}-cover.jpg"
