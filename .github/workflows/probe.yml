name: App recon (screenshots, read-only)

on:
  workflow_dispatch:
    inputs:
      listing:
        description: "Zillow URL to analyze"
        required: true

permissions:
  contents: write   # results are published as a draft-free prerelease (artifact downloads are blocked from Claude's sandbox)

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npm ci && npx playwright install chromium
      - name: Probe
        env:
          DC_EMAIL: ${{ secrets.DC_EMAIL }}
          DC_PASSWORD: ${{ secrets.DC_PASSWORD }}
        run: node scripts/probe.js "${{ github.event.inputs.listing }}" probe
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd probe && zip -qr ../probe.zip . && cd ..
          TAG="probe-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" probe.zip --prerelease --title "$TAG (app recon)" --notes "Read-only app screenshots for planning feature videos. Safe to delete."
