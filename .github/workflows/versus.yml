name: Head to Head video (manual)

on:
  workflow_dispatch:
    inputs:
      matchup:
        description: "Matchup file in versus/ without .json, e.g. house-vs-duplex"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-reel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/kokoro
          key: kokoro-onnx-v1
      - name: Install dependencies
        run: |
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          pip install --quiet kokoro-onnx pillow numpy
          mkdir -p ~/kokoro && cd ~/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
      - name: Build the video
        id: build
        env:
          KOKORO_ONNX_DIR: /home/runner/kokoro
        run: |
          SLUG="versus-${{ github.event.inputs.matchup }}-$(date -u +%Y%m%d-%H%M)"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          python3 scripts/versus.py "versus/${{ github.event.inputs.matchup }}.json" "dist/$SLUG.mp4"
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.build.outputs.slug }}"
          gh release create "$TAG" "dist/$TAG.mp4" "dist/$TAG-cover.jpg" --prerelease --title "$(cat dist/title.txt)" --notes-file dist/caption.txt
