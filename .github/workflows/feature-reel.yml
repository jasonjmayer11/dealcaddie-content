name: Feature tour reel (manual)

on:
  workflow_dispatch:
    inputs:
      listing:
        description: "Zillow URL to analyze (pick one that cash flows on several strategies)"
        required: true
      kind:
        description: "Which video"
        type: choice
        options: [investor]
        default: investor

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # lock only the build (same content account as the daily run) — never the approval wait
    concurrency:
      group: daily-reel
      cancel-in-progress: false
    outputs:
      slug: ${{ steps.build.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium
          curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
          pip install --quiet pillow numpy
      - name: Record
        env:
          DC_EMAIL: ${{ secrets.DC_EMAIL }}
          DC_PASSWORD: ${{ secrets.DC_PASSWORD }}
        run: node scripts/record_features.js "${{ github.event.inputs.listing }}" work
      - name: Assemble
        id: build
        run: |
          SLUG="feature-${{ github.event.inputs.kind }}-$(date -u +%Y%m%d-%H%M)"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          python3 scripts/assemble_features.py work "dist/$SLUG.mp4"
          mv dist/cover.jpg "dist/$SLUG-cover.jpg"
          cat dist/caption.txt
      - name: Publish as a release (with the raw captures for review)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.build.outputs.slug }}"
          [ -z "$TAG" ] && TAG="feature-failed-$(date -u +%Y%m%d-%H%M)"
          cd work && zip -qr ../captures.zip . && cd ..
          FILES="captures.zip"
          [ -f "dist/$TAG.mp4" ] && FILES="dist/$TAG.mp4 dist/$TAG-cover.jpg $FILES"
          NOTES=dist/caption.txt; [ -f "$NOTES" ] || { echo "build failed — see captures.zip" > /tmp/n.txt; NOTES=/tmp/n.txt; }
          for i in 1 2 3 4; do
            TITLE=$(python3 -c "import json;print(' '.join(json.load(open('dist/meta.json'))['hook']))" 2>/dev/null || echo "$TAG")
            gh release create "$TAG" $FILES --prerelease --title "$TITLE" --notes-file "$NOTES" && break
            [ "$i" = 4 ] && exit 1; sleep $((i*20))
          done

  post:
    needs: reel
    if: needs.reel.result == 'success' && needs.reel.outputs.slug != '' && vars.APPROVAL_MODE == 'github' && vars.POSTING_ENABLED == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: social
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.reel.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the approved reel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.reel.outputs.slug }}"
          gh release download "$TAG" -p "$TAG.mp4" -p "$TAG-cover.jpg" -D post
          gh release view "$TAG" --json body --jq .body > post/caption.txt
          gh release view "$TAG" --json name --jq .name > post/title.txt
      - name: Post via Upload-Post
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ vars.UPLOAD_POST_USER }}
          POST_PLATFORMS: ${{ vars.POST_PLATFORMS }}
          IDEMPOTENCY_KEY: ${{ needs.reel.outputs.slug }}
        run: |
          pip install --quiet requests
          TAG="${{ needs.reel.outputs.slug }}"
          python3 scripts/post_social.py "post/$TAG.mp4" "$(cat post/title.txt)" post/caption.txt "post/$TAG-cover.jpg"
